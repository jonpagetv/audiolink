<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>audiolink — Admin</title>
  <link rel="stylesheet" href="/shared/style.css" />
</head>
<body>
  <header class="app-header" id="appHeader"></header>

  <div class="page">
    <h1 class="page-title">Admin</h1>
    <p class="page-subtitle">Link availability, moderation, and activity.</p>

    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">System</h2>
      </div>
      <div class="stat-row">
        <span class="stat-label">Link availability</span>
        <span class="status-badge status-idle" id="enabledStatus">—</span>
        <button id="toggleEnabledBtn" type="button" class="btn-secondary">—</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Change Password</h2>
      </div>
      <form id="changePasswordForm" class="inline-form">
        <div class="field">
          <label for="passwordRole">Account</label>
          <select id="passwordRole">
            <option value="studio">Studio</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn-primary">Change Password</button>
      </form>
      <p class="panel-hint">At least 12 characters, including an uppercase letter, a lowercase letter, a number, and a symbol.</p>
      <p id="changePasswordError" class="form-error"></p>
      <p id="changePasswordSuccess" class="form-success"></p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Links</h2>
        <button id="refreshLinksBtn" type="button" class="btn-ghost">Refresh</button>
      </div>
      <form id="createLinkForm" class="inline-form">
        <div class="field">
          <label for="newLinkName">New Link name</label>
          <input type="text" id="newLinkName" placeholder="e.g. Morning Desk" required />
        </div>
        <button type="submit" class="btn-primary">Create Link</button>
        <span id="createLinkError" class="form-error"></span>
      </form>
      <div class="table-wrap">
        <table id="linksTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Created</th>
              <th>Status</th>
              <th>URL</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="linksList"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Recent Activity</h2>
        <button id="refreshActivityBtn" type="button" class="btn-ghost">Refresh</button>
      </div>
      <!-- Newest first, 20 per page, optionally narrowed to a date/time range. -->
      <div class="inline-form">
        <div class="field">
          <label for="activityFrom">From</label>
          <input type="datetime-local" id="activityFrom" />
        </div>
        <div class="field">
          <label for="activityTo">To</label>
          <input type="datetime-local" id="activityTo" />
        </div>
        <button id="applyActivityFilterBtn" type="button" class="btn-secondary">Filter</button>
        <button id="clearActivityFilterBtn" type="button" class="btn-ghost">Clear</button>
      </div>
      <div class="table-wrap">
        <table id="activityTable">
          <thead>
            <tr>
              <th>When</th>
              <th>Event</th>
              <th>Link</th>
              <th>Detail</th>
            </tr>
          </thead>
          <tbody id="activityList"></tbody>
        </table>
      </div>
      <div class="pagination-row">
        <button id="activityPrevBtn" type="button" class="btn-ghost">Previous</button>
        <span class="stat-label" id="activityPageInfo">Page 1 of 1</span>
        <button id="activityNextBtn" type="button" class="btn-ghost">Next</button>
      </div>
    </section>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
