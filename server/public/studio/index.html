<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>audiolink — Studio</title>
  <link rel="stylesheet" href="/shared/style.css" />
</head>
<body>
  <header class="app-header" id="appHeader"></header>

  <div class="page">
    <h1 class="page-title">Studio</h1>
    <p class="page-subtitle">Start incoming Links and manage availability.</p>

    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Live Call</h2>
      </div>
      <div class="stat-row">
        <span class="status-badge status-idle" id="status">idle</span>
        <span class="stat-label">Round-trip</span>
        <span class="stat-value" id="rtt">—</span>
      </div>
      <audio id="remoteAudio" autoplay></audio>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Audio Devices</h2>
        <button id="refreshDevicesBtn" type="button" class="btn-ghost">Refresh Devices</button>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="inputSelect">Input</label>
          <select id="inputSelect" disabled><option value="">(system default)</option></select>
        </div>
        <div class="field">
          <label for="outputSelect">Output</label>
          <select id="outputSelect" disabled><option value="">(system default)</option></select>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Links</h2>
        <button id="refreshLinksBtn" type="button" class="btn-ghost">Refresh</button>
      </div>
      <form id="createLinkForm" class="inline-form">
        <div class="field">
          <label for="newLinkName">New Link name</label>
          <input type="text" id="newLinkName" placeholder="e.g. Morning Desk" required />
        </div>
        <button type="submit" class="btn-primary">Create Link</button>
        <span id="createLinkError" class="form-error"></span>
      </form>
      <div class="table-wrap">
        <table id="linksTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Created</th>
              <th>Status</th>
              <th>URL</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="linksList"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script type="module" src="studio.js"></script>
</body>
</html>
