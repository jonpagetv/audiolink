# coturn config for audiolink — Stage 0.
#
# Single predictable relay port by design (see CLAUDE.md): both peers use
# iceTransportPolicy: 'relay' and go through this instance only, no P2P.
#
# Install: sudo apt install coturn
# Deploy:  sudo cp infra/turnserver.conf /etc/turnserver.conf
#          sudo systemctl enable --now coturn
#
# static-auth-secret must match TURN_SECRET in server/.env — the Node app
# mints short-lived username/credential pairs from it (TURN REST API auth).

listening-port=3478
fingerprint

# Explicit, not autodiscovered: coturn's address autodiscovery can run
# before the LAN interface has an IP at boot (seen in practice — the
# service crash-looped at startup with "Cannot configure any meaningful
# IP listener address" until this was set). Update if the VM's LAN IP
# changes; run `ip -4 addr show scope global` to check it.
listening-ip=CHANGE_ME_VM_LAN_IP

# Stage 5 (field test): the VM sits behind NAT (router does the public IP
# <-> LAN IP translation). Without this, coturn hands external peers a
# relay candidate on the private LAN IP, which is unreachable from the
# public internet — TURN would work for on-prem peers only, and silently
# fail for the field client. Format: <public-ip>/<private-ip>. Update if
# either address changes.
external-ip=CHANGE_ME_PUBLIC_IP/CHANGE_ME_VM_LAN_IP

use-auth-secret
static-auth-secret=CHANGE_ME_SHARED_SECRET
realm=audiolink

# Relay port range — keep narrow so the LAN/router firewall rule stays
# small and predictable alongside the signaling port (3478).
min-port=49152
max-port=49172

# Plain TURN, not TURNS: WebRTC media is already DTLS-SRTP encrypted
# end-to-end regardless of whether the TURN transport itself is secured,
# so this is a defense-in-depth gap (an on-path observer could see TURN
# control traffic, i.e. allocate/permission signaling) rather than a
# functional one. Deferred to Stage 6 hardening, not needed for the
# Stage 5 field-test gate.
no-tls
no-dtls

no-multicast-peers

# Both peers in this app always use relay-only ICE candidates
# (iceTransportPolicy: 'relay'), so the "peer" address in every
# CreatePermission is coturn's own other allocation on this same host —
# never loopback, since listening-ip must be a real routable interface.
# no-loopback-peers is therefore safe to enable unconditionally.
#
# A broader denied-peer-ip block covering RFC1918/link-local space (the
# usual TURN-server SSRF hardening advice, preventing a relay being used
# to reach internal LAN services) was considered and deliberately NOT
# added: coturn's own listening-ip on this deployment is itself a private
# LAN address, so a blanket private-range denial would deny coturn's own
# operating address and break the relay entirely. Revisit only with a
# config that can distinguish "this box's own address" from "some other
# internal host" — not attempted here.
no-loopback-peers

# CLI/telnet management interface — unused by this app, and disabling it
# outright is strictly safer than relying on its default localhost bind.
no-cli
