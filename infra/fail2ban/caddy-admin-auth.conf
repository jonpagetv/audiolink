# fail2ban filter for repeated 401s, matched against Caddy's JSON access
# log (infra/Caddyfile's `log` directive). Caddy's default log format puts
# remote_ip ahead of status in the same line, so a simple ordered match is
# reliable without needing to fully parse the JSON.
#
# Originally written when 401s only ever meant a failed /admin Basic Auth
# attempt (hence the filename/jail name). Since multi-link Stage 1 moved
# auth into Node (real login, no more Caddy Basic Auth), this same
# path-agnostic match also catches repeated failed POST /api/login
# attempts (studio and admin) for free — a 401 is a 401 in Caddy's log
# regardless of which layer produced it. Kept the original name rather
# than renaming (which would need a coordinated redeploy of both the
# filter and jail files) since the behavior is what matters, not the label.
#
# Deploy: sudo cp infra/fail2ban/caddy-admin-auth.conf /etc/fail2ban/filter.d/
[Definition]
failregex = "remote_ip":"<HOST>".*"status":401
ignoreregex =
