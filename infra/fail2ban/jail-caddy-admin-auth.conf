# fail2ban jail for repeated 401s in Caddy's access log — originally just
# /admin Basic Auth, now also covers failed POST /api/login attempts
# (studio and admin) since multi-link Stage 1 moved auth into Node. See
# caddy-admin-auth.conf for why the name wasn't updated to match.
# 5 failures within 10 minutes -> 1 hour ban.
#
# Deploy: sudo cp infra/fail2ban/jail-caddy-admin-auth.conf /etc/fail2ban/jail.d/
[caddy-admin-auth]
enabled = true
filter = caddy-admin-auth
logpath = /var/log/caddy/access.log
maxretry = 5
findtime = 600
bantime = 3600
